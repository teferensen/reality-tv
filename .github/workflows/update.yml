name: Update air dates

on:
  schedule:
    - cron: "23 12 * * *"   # every day at 12:23 UTC (4:23 AM Pacific)
  workflow_dispatch:         # adds a "Run workflow" button on the Actions tab
  push:
    branches: [main]         # refresh and redeploy whenever you edit the files

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-air-dates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest schedules from TVmaze
        run: python update.py

      - name: Save data.json to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update air dates"
            git push
          fi

      - name: Package the site
        run: |
          mkdir _site
          cp index.html data.json _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
